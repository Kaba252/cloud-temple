<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="云端禅院">
  <meta name="theme-color" content="#1c1410">
  <meta name="description" content="云端禅院 · 敲木鱼、盘串、上香、求签许愿、供奉本命佛。仅供文化娱乐与冥想放松。">
  <title>云端禅院</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell" id="shell">
    <!-- Gate -->
    <section id="gate" class="gate" aria-label="山门">
      <div class="gate-mist"></div>
      <div class="gate-inner">
        <div class="gate-lotus" aria-hidden="true">
          <svg viewBox="0 0 80 80" width="72" height="72">
            <defs>
              <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#f0e0a8"/>
                <stop offset="100%" stop-color="#c9a962"/>
              </linearGradient>
            </defs>
            <path d="M40 62 C28 52 16 48 14 36 C14 26 26 24 32 32 C28 18 34 10 40 10 C46 10 52 18 48 32 C54 24 66 26 66 36 C64 48 52 52 40 62Z" fill="url(#gGold)" opacity=".95"/>
            <circle cx="40" cy="38" r="6" fill="#f7f1e5"/>
          </svg>
        </div>
        <h1 class="gate-title">云端禅院</h1>
        <p class="gate-sub">一念即至 · 万缘同修</p>
        <button type="button" class="gate-enter" id="btnEnter">踏入山门</button>
        <p class="gate-note">仅供文化娱乐与冥想放松</p>
      </div>
    </section>

    <!-- App -->
    <div id="app" class="app is-hidden" hidden>
      <header class="topbar">
        <div class="topbar-left">
          <div class="brand">
            <span class="brand-name">云端禅院</span>
            <button type="button" class="online-chip" id="btnOnline" title="同屏说明">
              <span class="online-dot"></span>
              <span id="onlineCount">1,024</span> 人同修
            </button>
          </div>
        </div>
        <div class="topbar-right">
          <button type="button" class="icon-btn" id="btnAmbient" aria-label="禅境音" title="禅境音">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 14c2-6 6-9 8-9s6 3 8 9"/><path d="M8 16c.8 2 2 3 4 3s3.2-1 4-3"/><circle cx="12" cy="11" r="1.2" fill="currentColor" stroke="none"/></svg>
          </button>
          <button type="button" class="icon-btn" id="btnMute" aria-label="音效" title="音效">
            <svg id="iconSoundOn" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 10v4h3l5 4V6L7 10H4z"/><path d="M16 9.5a4 4 0 010 5"/><path d="M18.5 7a7 7 0 010 10"/></svg>
            <svg id="iconSoundOff" class="is-hidden" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 10v4h3l5 4V6L7 10H4z"/><path d="M19 9l-6 6M13 9l6 6"/></svg>
          </button>
          <button type="button" class="merit-chip" id="btnMerit" title="功德与签到">
            <span class="merit-label">功德</span>
            <span class="merit-num" id="meritNum">0</span>
          </button>
          <button type="button" class="icon-btn" id="btnMenu" aria-label="更多">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18" cy="12" r="1.4"/></svg>
          </button>
        </div>
      </header>

      <div class="almanac-bar" id="almanacBar">
        <span id="almanacDate"></span>
        <span class="almanac-yi" id="almanacYi"></span>
      </div>

      <main class="hall" id="hall">
        <div class="hall-glow" aria-hidden="true"></div>
        <div class="hanging hanging-l" aria-hidden="true"></div>
        <div class="hanging hanging-r" aria-hidden="true"></div>

        <section class="altar" id="altar">
          <div class="altar-niche">
            <div class="altar-figure" id="altarFigure"></div>
            <div class="incense-burner" id="incenseBurner"></div>
            <div class="lamp-row" id="lampRow"></div>
          </div>
          <p class="altar-caption" id="altarCaption">禅院佛龛</p>
        </section>

        <div class="peers" id="peers" aria-label="同修"></div>

        <section class="self-stage" id="selfStage">
          <div class="action-prop woodfish-prop" id="woodfishProp" aria-hidden="true"></div>
          <div class="action-prop beads-prop" id="beadsProp" aria-hidden="true"></div>
          <div class="monk-wrap" id="monkWrap">
            <div class="monk" id="monk"></div>
            <div class="cushion" id="cushion"></div>
            <div class="nameplate">
              <span id="monkName">小沙弥</span>
            </div>
          </div>
        </section>

        <div class="floats" id="floats" aria-hidden="true"></div>
      </main>

      <div class="checkin-hint is-hidden" id="checkinHint">
        <span>今日尚未签到</span>
        <button type="button" id="btnCheckinQuick">洒扫签到</button>
      </div>

      <nav class="dock" aria-label="修行">
        <div class="dock-primary">
          <button type="button" class="act" id="btnWoodfish">
            <span class="act-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20"><ellipse cx="11" cy="13" rx="7.5" ry="6" fill="none" stroke="currentColor" stroke-width="1.6"/><ellipse cx="11" cy="13" rx="3.5" ry="2.6" fill="none" stroke="currentColor" stroke-width="1.1"/><path d="M16 10l4-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="20.2" cy="4.4" r="1.5" fill="currentColor"/></svg>
          </span>
            <span>敲木鱼</span>
          </button>
          <button type="button" class="act" id="btnBeads">
            <span class="act-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6">
              <circle cx="12" cy="4.2" r="1.7" fill="currentColor" stroke="none"/>
              <circle cx="17.5" cy="7.2" r="1.5"/><circle cx="19.2" cy="12" r="1.5"/>
              <circle cx="17.5" cy="16.8" r="1.5"/><circle cx="12" cy="19.5" r="1.5"/>
              <circle cx="6.5" cy="16.8" r="1.5"/><circle cx="4.8" cy="12" r="1.5"/>
              <circle cx="6.5" cy="7.2" r="1.5"/>
            </svg>
          </span>
            <span>盘串</span>
          </button>
          <button type="button" class="act" id="btnIncense">
            <span class="act-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
              <path d="M8 20V8"/><path d="M12 20V6"/><path d="M16 20V8"/>
              <path d="M12 6c0-2 .8-3.5.8-3.5" stroke-width="1.2"/>
              <circle cx="8" cy="7" r="0.8" fill="currentColor" stroke="none"/>
              <circle cx="12" cy="5" r="0.8" fill="currentColor" stroke="none"/>
              <circle cx="16" cy="7" r="0.8" fill="currentColor" stroke="none"/>
            </svg>
          </span>
            <span>上香</span>
          </button>
          <button type="button" class="act act-bow" id="btnBow">
            <span class="act-icon act-icon-bow" aria-hidden="true">礼</span>
            <span>拜佛</span>
            <small>长按连磕</small>
          </button>
        </div>
        <div class="dock-secondary">
          <button type="button" class="pill" data-sheet="buddha">本命佛</button>
          <button type="button" class="pill" data-sheet="lot">求签</button>
          <button type="button" class="pill" data-sheet="wish">许愿</button>
          <button type="button" class="pill" data-sheet="lamp">点灯</button>
          <button type="button" class="pill" data-sheet="cushion">蒲团</button>
          <button type="button" class="pill" data-sheet="board">榜单</button>
        </div>
        <p class="footer-note">仅供文化娱乐与冥想放松 · 不涉及真实宗教活动</p>
      </nav>
    </div>

    <!-- Bow overlay -->
    <div id="bowOverlay" class="bow-overlay is-hidden" hidden>
      <div class="bow-ring-wrap">
        <svg class="bow-ring" viewBox="0 0 120 120" width="160" height="160">
          <circle cx="60" cy="60" r="54" class="bow-track"/>
          <circle cx="60" cy="60" r="54" class="bow-progress" id="bowProgress"/>
        </svg>
        <div class="bow-count">
          <strong id="bowNum">0</strong>
          <span>/ 108</span>
        </div>
      </div>
      <p class="bow-tip" id="bowTip">长按连磕一百零八响头</p>
      <button type="button" class="bow-cancel" id="btnBowCancel">停止</button>
    </div>

    <!-- Sheet -->
    <div id="backdrop" class="backdrop is-hidden" hidden></div>
    <aside id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <h2 id="sheetTitle"></h2>
        <button type="button" class="sheet-close" id="btnSheetClose" aria-label="关闭">关闭</button>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
    </aside>

    <!-- Toast -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
