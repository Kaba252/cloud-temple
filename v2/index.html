<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="云端禅院">
  <meta name="theme-color" content="#12161c">
  <meta name="description" content="云端禅院 · 三D云端禅修。敲木鱼、盘串、礼拜、求签许愿、供奉本命佛。仅供文化娱乐与冥想放松。">
  <title>云端禅院</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <canvas id="view"></canvas>

    <section id="loading" class="loading">
      <div class="loading-inner">
        <div class="loading-lotus" aria-hidden="true">✦</div>
        <h1>云端禅院</h1>
        <p>一念即至 · 万缘同修</p>
        <div class="bar"><i id="loadBar"></i></div>
        <span id="loadHint">正在入山…</span>
      </div>
    </section>

    <div id="hud" class="hud is-hidden">
      <header class="top">
        <div class="top-left">
          <button type="button" class="chip" id="btnVisitors" title="同修名录">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="9" cy="8" r="3"/><circle cx="16" cy="9" r="2.4"/><path d="M4 18c1.2-3 3.2-4.5 5-4.5S13 15 14 18"/><path d="M14 14.2c1.4-.6 2.8-.4 4 .8"/></svg>
            <span id="peerCount">1</span>
          </button>
          <button type="button" class="chip" id="btnServer" title="选择禅堂">
            <span id="serverName">禅堂一</span>
            <small id="serverOcc">0/50</small>
          </button>
        </div>
        <p class="hint" id="hint">点地面行走 · 拖动环顾 · 双指缩放</p>
        <div class="top-right">
          <button type="button" class="chip merit" id="btnMerit" title="功德">功德 <b id="meritNum">0</b></button>
          <button type="button" class="icon-btn" id="btnSound" aria-label="声音" title="声音默认关闭">
            <svg id="icSoundOff" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 10v4h3l5 4V6L7 10H4z"/><path d="M19 9l-6 6M13 9l6 6"/></svg>
            <svg id="icSoundOn" class="is-hidden" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 10v4h3l5 4V6L7 10H4z"/><path d="M16 9.5a4 4 0 010 5"/><path d="M18.5 7a7 7 0 010 10"/></svg>
          </button>
          <button type="button" class="icon-btn" id="btnMenu" aria-label="设置">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M12 4v2M12 18v2M4 12h2M18 12h2M6.3 6.3l1.4 1.4M16.3 16.3l1.4 1.4M17.7 6.3l-1.4 1.4M7.7 16.3l-1.4 1.4"/></svg>
          </button>
        </div>
      </header>

      <div class="area-tag" id="areaTag">入口</div>
      <div class="name-float" id="nameFloat"></div>
      <button type="button" class="prompt is-hidden" id="prompt"></button>

      <div class="joystick is-hidden" id="joystick" aria-hidden="true">
        <div class="joy-base"><div class="joy-knob" id="joyKnob"></div></div>
      </div>

      <div class="checkin-hint is-hidden" id="checkinHint">
        <span>今日尚未签到</span>
        <button type="button" id="btnCheckinQuick">洒扫签到</button>
      </div>

      <nav class="dock">
        <div class="dock-main">
          <button type="button" class="act" id="btnHeshi">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 4v10"/><path d="M9 8c0 0-3 2-3 6 0 3 2 5 6 5s6-2 6-5c0-4-3-6-3-6"/></svg>
            <span>合掌</span>
          </button>
          <button type="button" class="act" id="btnBow">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="6" r="2.2"/><path d="M8 20c.5-5 2-8 4-8s3.5 3 4 8"/><path d="M7 13h10"/></svg>
            <span>礼拜</span>
          </button>
          <button type="button" class="act" id="btnWoodfish">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"><ellipse cx="11" cy="13" rx="7" ry="5.5"/><path d="M16 10l4-5"/><circle cx="20.2" cy="4.6" r="1.4" fill="currentColor" stroke="none"/></svg>
            <span>木鱼</span>
          </button>
          <button type="button" class="act" id="btnBeads">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6">
              <circle cx="12" cy="4.2" r="1.5" fill="currentColor" stroke="none"/>
              <circle cx="17.4" cy="7.2" r="1.4"/><circle cx="19" cy="12" r="1.4"/>
              <circle cx="17.4" cy="16.8" r="1.4"/><circle cx="12" cy="19.4" r="1.4"/>
              <circle cx="6.6" cy="16.8" r="1.4"/><circle cx="5" cy="12" r="1.4"/>
              <circle cx="6.6" cy="7.2" r="1.4"/>
            </svg>
            <span>念珠</span>
          </button>
        </div>
        <div class="dock-more">
          <button type="button" class="pill" data-sheet="buddha">本命佛</button>
          <button type="button" class="pill" data-sheet="lot">求签</button>
          <button type="button" class="pill" data-sheet="wish">许愿</button>
          <button type="button" class="pill" data-sheet="lamp">点灯</button>
          <button type="button" class="pill" data-sheet="map">地图</button>
          <button type="button" class="pill" data-sheet="board">功德</button>
          <button type="button" class="pill" data-sheet="almanac">宜忌</button>
        </div>
        <p class="legal">仅供文化娱乐与冥想放松 · 不涉及真实宗教活动</p>
      </nav>
    </div>

    <div id="bowOverlay" class="bow-overlay is-hidden" hidden>
      <div class="bow-count"><strong id="bowNum">0</strong><span>/ 108</span></div>
      <p>一心礼敬</p>
      <button type="button" id="btnBowStop">停止</button>
    </div>

    <div id="backdrop" class="backdrop is-hidden" hidden></div>
    <aside id="sheet" class="sheet" role="dialog" aria-modal="true" hidden>
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <h2 id="sheetTitle"></h2>
        <button type="button" id="btnSheetClose">关闭</button>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
    </aside>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
